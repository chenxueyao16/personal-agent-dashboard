    :root {

      --surface: #ffffff;

      --border-soft: #efece6;
      --text: #1c1b19;

      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;

      padding: 28px 24px 40px;
    }

      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }

    .title-block h1 {
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .title-block .subtitle {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: var(--shadow);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .legend-swatch {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Three products always in one horizontal row; scroll on narrow viewports */
    .board-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(var(--col-min), 1fr));
      gap: 16px;
      align-items: stretch;
      min-width: calc(var(--col-min) * 3 + 32px);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .card-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(180deg, #fcfbf9 0%, #ffffff 100%);
      flex-shrink: 0;
    }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .product-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .product-badge {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid #d5e4db;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .meta-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .meta-row strong {
      color: var(--text-secondary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .chart-wrap {
      padding: 14px 12px 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }

    .chart-box {
      width: 100%;
      max-width: 240px;
      height: 200px;
      position: relative;
    }

    .table-wrap {
      padding: 0 0 6px;
      overflow-x: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
    }

    thead th {
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      padding: 10px 10px 7px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      white-space: nowrap;
    }

    thead th.num { text-align: right; }

    tbody td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: top;
      color: var(--text);
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #faf8f4; }

    td.scene {
      font-weight: 550;
      white-space: nowrap;
    }

    td.scene .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 0.7rem;
    }

    td.pct {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 0.7rem;
    }

    td.reps { min-width: 120px; }

    .rep-links {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .rep-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.7rem;
      line-height: 1.35;
      border-bottom: 1px solid transparent;
      width: fit-content;
      max-width: 100%;
    }

    .rep-links a:hover {
      border-bottom-color: var(--accent);
      color: #2c4338;
    }

    footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      justify-content: space-between;
    }

    footer .note { max-width: 760px; }

    footer .totals {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }
  </style>
</head>

      }).join("");

      card.innerHTML = `
        <div class="card-header">
          <div class="product-row">
            <h2 class="product-name" id="title-${product.id}">${escapeHtml(product.name)}</h2>
            <span class="product-badge">${product.tasks} tasks</span>
          </div>
          <div class="meta-row">
            <span>搜索次数 <strong>${escapeHtml(product.searchCalls)}</strong></span>
            <span>任务数 <strong>${product.tasks}</strong></span>
            <span>样本池 <strong>${escapeHtml(product.pool)}</strong></span>
          </div>
        </div>
        <div class="chart-wrap">
          <div class="chart-box"><canvas id="${chartId}" aria-label="${escapeHtml(product.name)} 用例占比饼图"></canvas></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>场景</th>
                <th class="num">帖数</th>
                <th class="num">占比</th>
                <th>典型代表帖</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;

      columns.appendChild(card);

      const labels = product.rows.map(r => r.scene);
      const data = product.rows.map(r => r.count);
      const colors = product.rows.map(r => CATEGORY_COLORS[r.scene] || "#999");

      new Chart(document.getElementById(chartId), {
        type: "doughnut",
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors,
            borderColor: "#ffffff",
            borderWidth: 2,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "58%",
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label(ctx) {
                  const row = product.rows[ctx.dataIndex];
                  return ` ${row.scene}: ${row.count}（${row.pct.toFixed(1)}%）`;
                }
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
