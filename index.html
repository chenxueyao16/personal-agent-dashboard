      color: var(--text-secondary);
      white-space: nowrap;

    const LEGEND_ORDER = [
      "邮件日历收件箱", "购物电商", "旅行酒店航班", "账单保险省钱", "电话客服",
      "技术开发设备", "研究策略内容", "餐厅订位", "健康生活方式", "预约政务求职"
    ];

    const legendBar = document.getElementById("legendBar");
    LEGEND_ORDER.forEach(name => {
      const el = document.createElement("span");
      el.className = "legend-item";
      el.innerHTML = `<span class="legend-swatch" style="background:${CATEGORY_COLORS[name]}"></span>${name}`;
      legendBar.appendChild(el);
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const columns = document.getElementById("columns");

    function renderBoard(list, container, prefix, daily) {
    list.forEach(product => {
      const card = document.createElement("section");
      card.className = "card";
      card.setAttribute("aria-labelledby", `title-${prefix}${product.id}`);

      const chartId = `chart-${prefix}${product.id}`;

      const rowsHtml = product.rows.map(r => {
        const color = CATEGORY_COLORS[r.scene] || "#999";
        const links = r.reps.map(rep =>
          `<a href="${escapeHtml(rep.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(rep.label)}">${escapeHtml(rep.label)}</a>`
        ).join("");
        return `<tr>
          <td class="scene"><span class="dot" style="background:${color}"></span>${escapeHtml(r.scene)}</td>
          <td class="num">${r.count}</td>
          <td class="pct">${r.pct.toFixed(1)}%</td>
          <td class="reps"><div class="rep-links">${links}</div></td>
        </tr>`;
      }).join("");

      card.innerHTML = `
        <div class="card-header">
          <div class="product-row">
            <h2 class="product-name" id="title-${prefix}${product.id}">${escapeHtml(product.name)}</h2>
            <span class="product-badge">${product.tasks} tasks</span>
          </div>
          <div class="meta-row">
            ${daily ? `<span>搜索 <strong>${product.searchCalls}</strong></span>
            <span>原始命中 <strong>${product.raw}</strong></span>
            <span>去重池 <strong>${product.pool}</strong></span>
            <span>有意义 <strong>${product.meaningful}</strong></span>
            <span>具体任务 <strong>${product.tasks}</strong></span>` : `<span>搜索次数 <strong>${escapeHtml(product.searchCalls)}</strong></span>
            <span>任务数 <strong>${product.tasks}</strong></span>
            <span>样本池 <strong>${escapeHtml(product.pool)}</strong></span>`}
          </div>
        </div>
        <div class="chart-wrap">
          <div class="chart-box"><canvas id="${chartId}" aria-label="${escapeHtml(product.name)} 用例占比饼图"></canvas></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>场景</th>
                <th class="num">帖数</th>
                <th class="num">占比</th>
                <th>典型代表帖</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;

      container.appendChild(card);
      if (!product.rows || product.rows.length === 0) {
        card.querySelector(".chart-wrap").outerHTML = '<div class="empty-note">无新增</div>';
        card.querySelector(".table-wrap").remove();
        return;
      }

      const labels = product.rows.map(r => r.scene);
      const data = product.rows.map(r => r.count);
      const colors = product.rows.map(r => CATEGORY_COLORS[r.scene] || "#999");

      new Chart(document.getElementById(chartId), {
        type: "doughnut",
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors,
            borderColor: "#ffffff",
            borderWidth: 2,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "58%",
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label(ctx) {
                  const row = product.rows[ctx.dataIndex];
                  return ` ${row.scene}: ${row.count}（${row.pct.toFixed(1)}%）`;
                }
              }
            }
          }
        }
      });
    });
    }

    renderBoard(PRODUCTS, columns, "", false);
    if (DAILY) {
      document.getElementById("dailyTitle").textContent = `近24小时更新（${DAILY.asof} 截至，北京时间）`;
      document.getElementById("dailySub").textContent = `窗口：${DAILY.window} · 每天10:00更新，同口径漏斗：原始命中→去重池→有意义使用→具体任务`;
      renderBoard(DAILY.products, document.getElementById("dailyColumns"), "d-", true);
    } else {
